"""
Defines the set of possible statuses for a product.
"""
enum ProductStatus {
  "The product is available for sale."
  ACTIVE
  "The product is not currently available for sale."
  INACTIVE
  "The product is no longer being sold."
  DISCONTINUED
}

# ---------------------------------------------------------------- #
# Shared Types
# ---------------------------------------------------------------- #

"""
A translated string for a category.
"""
type Translation {
  "Language code (e.g., 'en', 'es')."
  lang: String!
  "The translated text for the category."
  text: String!
}

"""
Language- and country-specific details for a product.
"""
type Localization {
  "Language code (e.g., 'en', 'es')."
  lang: String!
  "Country code (e.g., 'us', 'mx')."
  country: String!
  "The localized name of the product."
  productName: String!
  "A localized description of the product."
  description: String
  "The price in the local currency."
  price: Float!
  "The currency code (e.g., 'USD', 'MXN')."
  currency: String!
}

"""
Global metadata containing the last update timestamps for major datasets.
Used heavily by clients for efficient caching and invalidation.
"""
type Metadata {
  "ISO-8601 timestamp of the last time any product or localization was modified."
  productsLastUpdated: AWSDateTime!
  "ISO-8601 timestamp of the last time any category or translation was modified."
  categoriesLastUpdated: AWSDateTime!
  "ISO two-letters code for language and country."
  defaultLocale:String
}

# ---------------------------------------------------------------- #
# Category Types
# ---------------------------------------------------------------- #

type Category {
  "The unique identifier for the category (e.g., 'Electronics')."
  category: ID!
  "All available translations for the category name."
  translations: [Translation!]!
  "When this specific category was last modified (optional – rarely needed)."
  lastUpdated: AWSDateTime
}

type PaginatedCategories {
  items: [Category!]!
  nextToken: String
  "When ANY category was last changed – perfect for cache invalidation."
  lastUpdated: AWSDateTime!
}

type CategoryTranslation {
  category: ID!
  text: String!
}

type PaginatedCategoryTranslations {
  items: [CategoryTranslation!]!
  nextToken: String
  "Same global timestamp as PaginatedCategories."
  lastUpdated: AWSDateTime!
}

# ---------------------------------------------------------------- #
# Product Types
# ---------------------------------------------------------------- #

type Product {
  sku: ID!
  category: String!
  imageUrl: String
  productStatus: ProductStatus!
  quantityInStock: Int!
  localizations: [Localization!]!
  "When this specific product was last modified (optional)."
  lastUpdated: AWSDateTime
}

type PaginatedProducts {
  items: [Product!]!
  nextToken: String
  "When ANY product or localization was last changed – critical for caching."
  lastUpdated: AWSDateTime!
}

# ---------------------------------------------------------------- #
# Input Types
# ---------------------------------------------------------------- #

input TranslationInput {
  lang: String!
  text: String!
}

input CreateCategoryInput {
  category: ID!
  translations: [TranslationInput!]!
}

input UpsertCategoryTranslationInput {
  category: ID!
  translations: [TranslationInput!]!
}

input LocalizationInput {
  lang: String!
  country: String!
  productName: String!
  description: String
  price: Float!
  currency: String!
}

input CreateProductInput {
  sku: ID!
  category: String!
  imageUrl: String
  productStatus: ProductStatus = ACTIVE
  quantityInStock: Int!
  localizations: [LocalizationInput!]!
}

input UpdateProductInput {
  sku: ID!
  category: String
  imageUrl: String
  productStatus: ProductStatus
  quantityInStock: Int
}

# ---------------------------------------------------------------- #
# Query
# ---------------------------------------------------------------- #

type Query {
  # Product Queries
  getProductsBySku(skus: [ID!]!, lang: String = "en", country: String = "us"): [Product]
  getProductsByCategory(category: String!, lang: String = "en", country: String = "us", limit: Int = 20, nextToken: String): PaginatedProducts
  getAllProductsByLocalization(lang: String = "en", country: String = "us", limit: Int = 20, nextToken: String): PaginatedProducts
  getAllProducts(limit: Int = 20, nextToken: String): PaginatedProducts
  searchProducts(search: String!, limit: Int = 20, nextToken: String): PaginatedProducts

  # Category Queries
  getCategory(category: ID!): Category
  getAllCategories(limit: Int = 20, nextToken: String): PaginatedCategories
  getAllCategoriesByLanguage(lang: String = "en", limit: Int = 20, nextToken: String): PaginatedCategoryTranslations
  searchCategories(search: String!, limit: Int = 20, nextToken: String): PaginatedCategories

  # Global metadata – extremely useful for HTTP caching and client-side cache busting
  "Returns the latest modification timestamps for products and categories."
  metadata: Metadata!
}

# ---------------------------------------------------------------- #
# Mutation
# ---------------------------------------------------------------- #

type Mutation {
  # Product Mutations
  createProduct(input: CreateProductInput!): Product!
  updateProduct(input: UpdateProductInput!): Product!
  deleteProduct(sku: ID!): Product
  addLocalization(sku: ID!, localizations: [LocalizationInput!]!): Product!
  updateLocalization(sku: ID!, localizations: [LocalizationInput!]!): Product!
  removeLocalization(sku: ID!, lang: String!, country: String!): Product!

  # Category Mutations
  createCategory(input: CreateCategoryInput!): Category!
  deleteCategory(category: ID!): Category
  upsertCategoryTranslation(input: UpsertCategoryTranslationInput!): Category!
  removeCategoryTranslation(category: ID!, lang: String!): Category!

  #Metadata Mutations
  setDefaultLocale(locale: String!): String!
}

# ---------------------------------------------------------------- #
# AWS AppSync Scalar Types
# ---------------------------------------------------------------- #

scalar AWSDateTime