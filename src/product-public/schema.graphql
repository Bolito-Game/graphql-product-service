"""
Defines the set of possible statuses for a product.
"""
enum ProductStatus {
  ACTIVE
  INACTIVE
  DISCONTINUED
}

# ---------------------------------------------------------------- #
# Supporting Types
# ---------------------------------------------------------------- #

type Translation {
  lang: String!
  text: String!
}

type Localization {
  lang: String!
  country: String!
  productName: String!
  description: String
  price: Float!
  currency: String!
}

# ---------------------------------------------------------------- #
# Category Types
# ---------------------------------------------------------------- #

type Category {
  category: ID!
  translations: [Translation!]!
}

type PaginatedCategories {
  items: [Category!]!
  nextToken: String
  "ISO-8601 timestamp when any category was last modified (create/update/delete/translation change)"
  lastUpdated: AWSDateTime!
}

type CategoryTranslation {
  category: ID!
  text: String!
}

type PaginatedCategoryTranslations {
  items: [CategoryTranslation!]!
  nextToken: String
  "Same global timestamp as PaginatedCategories — reflects the source data freshness"
  lastUpdated: AWSDateTime!
}

# ---------------------------------------------------------------- #
# Product Types
# ---------------------------------------------------------------- #

type Product {
  sku: ID!
  category: String!
  imageUrl: String
  productStatus: ProductStatus!
  quantityInStock: Int!
  localizations: [Localization!]!
}

type PaginatedProducts {
  items: [Product!]!
  nextToken: String
  "ISO-8601 timestamp when any product or localization was last modified"
  lastUpdated: AWSDateTime!
}

# ---------------------------------------------------------------- #
# New: Global metadata query (highly recommended)
# ---------------------------------------------------------------- #

"""
Global last-update timestamps. Perfect for:
- HTTP ETag / If-Modified-Since caching
- Apollo/URQL/RTK-Query cache invalidation
- Knowing whether to refetch entire datasets
"""
type Metadata {
  productsLastUpdated: AWSDateTime!
  categoriesLastUpdated: AWSDateTime!
}

# ---------------------------------------------------------------- #
# Query — updated with metadata and lastUpdated fields
# ---------------------------------------------------------------- #

type Query {
  # Product Queries
  getProductsBySku(skus: [ID!]!, lang: String = "en", country: String = "us"): [Product]
  getProductsByCategory(category: String!, lang: String = "en", country: String = "us"): [Product!]!
  getAllProductsByLocalization(lang: String = "en", country: String = "us", limit: Int = 20, nextToken: String): PaginatedProducts
  getAllProducts(limit: Int = 20, nextToken: String): PaginatedProducts

  # Category Queries
  getCategory(category: ID!): Category
  getAllCategories(limit: Int = 20, nextToken: String): PaginatedCategories
  getAllCategoriesByLanguage(lang: String = "en", limit: Int = 20, nextToken: String): PaginatedCategoryTranslations

  "Get the latest modification timestamps for products and categories — ideal for caching"
  metadata: Metadata!
}

# Required scalar if not already present in your schema
scalar AWSDateTime