"""
Defines the set of possible statuses for a product.
"""
enum ProductStatus {
  "The product is available for sale."
  ACTIVE
  "The product is not currently available for sale."
  INACTIVE
  "The product is no longer being sold."
  DISCONTINUED
}

# ---------------------------------------------------------------- #

"""
Defines the structure of a localization for a product, containing
language- and country-specific details.
"""
type Localization {
  "Language code (e.g., 'en', 'es')."
  lang: String!
  "Country code (e.g., 'us', 'mx')."
  country: String!
  "The localized name of the product's category."
  categoryText: String!
  "The localized name of the product."
  productName: String!
  "A localized description of the product."
  description: String
  "The price in the local currency."
  price: Float!
  "The currency code (e.g., 'USD', 'MXN')."
  currency: String!
}

# ---------------------------------------------------------------- #

"""
Defines the structure of a product.
"""
type Product {
  "The unique identifier for the product (Stock Keeping Unit)."
  sku: ID!
  "The global, non-localized category key for the product."
  category: String!
  "A URL for the product's primary image."
  imageUrl: String
  "The current status of the product."
  productStatus: ProductStatus!
  "The number of units currently in stock."
  quantityInStock: Int!
  "A list of all available localizations for the product."
  localizations: [Localization!]!
}

# ---------------------------------------------------------------- #

"""
A wrapper for paginated product lists, including the items
and a token to fetch the next page.
"""
type PaginatedProducts {
  "A list of products on the current page."
  items: [Product!]!
  "A token to pass to the next query to get the next page of results. Null if there are no more pages."
  nextToken: String
}

# ---------------------------------------------------------------- #
# Input Types for Mutations
# ---------------------------------------------------------------- #

"""
Input for creating or updating a localization. All fields are required.
"""
input LocalizationInput {
  lang: String!
  country: String!
  categoryText: String!
  productName: String!
  description: String
  price: Float!
  currency: String!
}

"""
Input for creating a new product.
"""
input CreateProductInput {
  sku: ID!
  category: String!
  imageUrl: String
  productStatus: ProductStatus = ACTIVE
  quantityInStock: Int!
  localizations: [LocalizationInput!]!
}

"""
Input for updating an existing product's core fields.
SKU is required to identify the product. All other fields are optional.
"""
input UpdateProductInput {
  sku: ID!
  category: String
  imageUrl: String
  productStatus: ProductStatus
  quantityInStock: Int
}

# ---------------------------------------------------------------- #
# Root Operation Types
# ---------------------------------------------------------------- #

"""
Defines all the read operations available in the API.
"""
type Query {
  """
  Retrieves a single product by its SKU.
  Returns the product with only the single, matching localization.
  """
  getProductBySku(sku: ID!, lang: String = "en", country: String = "us"): Product

  """
  Retrieves all products belonging to a specific category.
  Returns each product with only the single, matching localization.
  """
  getProductsByCategory(category: String!, lang: String = "en", country: String = "us"): [Product!]!

  """
  Retrieves a paginated list of all products that have a specific localization.
  Returns each product with only the single, matching localization.
  """
  getAllProductsByLocalization(lang: String = "en", country: String = "us", limit: Int = 20, nextToken: String): PaginatedProducts

  """
  Retrieves a paginated list of all products with all of their localizations.
  """
  getAllProducts(limit: Int = 20, nextToken: String): PaginatedProducts
}

# ---------------------------------------------------------------- #

"""
Defines all the write (Create, Update, Delete) operations.
"""
type Mutation {
  """
  Creates a new product along with its initial localizations.
  Returns the newly created product.
  """
  createProduct(input: CreateProductInput!): Product!

  """
  Updates the core fields of an existing product.
  To manage localizations, use addLocalization, updateLocalization, or removeLocalization.
  Returns the updated product.
  """
  updateProduct(input: UpdateProductInput!): Product!

  """
  Deletes a product from the system using its SKU.
  Returns the product that was deleted.
  """
  deleteProduct(sku: ID!): Product

  """
  Adds a new localization to an existing product.
  Returns the product with the new localization added.
  """
  addLocalization(sku: ID!, localization: LocalizationInput!): Product!

  """
  Updates an existing localization on a product, identified by language and country.
  Returns the product with the updated localization.
  """
  updateLocalization(sku: ID!, localization: LocalizationInput!): Product!

  """
  Removes a localization from a product.
  Returns the product with the localization removed.
  """
  removeLocalization(sku: ID!, lang: String!, country: String!): Product!
}