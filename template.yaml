AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  GraphQL Product Service
  A production-ready serverless application providing a GraphQL API for product data, with CORS.

Parameters:
  ProjectName:
    Type: String
    Default: ProductService
  TableName:
    Type: String
    Default: Products

Globals:
  Function:
    Timeout: 10
    MemorySize: 256

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      AttributeDefinitions:
        - AttributeName: SKU
          AttributeType: S
        - AttributeName: Category
          AttributeType: S
      KeySchema:
        - AttributeName: SKU
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: CategoryIndex
          KeySchema:
            - AttributeName: Category
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  GraphQLFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-GraphQL-Handler
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TableName
      Tracing: Active

  GraphQLApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref ProjectName
      Description: "API for the Product Service"
      EndpointConfiguration:
        Types:
          - EDGE

  GraphQLApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GraphQLApi
      ParentId: !GetAtt GraphQLApi.RootResourceId
      PathPart: graphql

  GraphQLApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref GraphQLApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GraphQLFunction.Arn}/invocations"

  GraphQLApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref GraphQLApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels: {}
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{ "statusCode": 200 }'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'" # CHANGEME

  GraphQLFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GraphQLFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # THIS IS THE CORRECTED LINE
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/graphql"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GraphQLApiMethod
      - GraphQLApiOptionsMethod
    Properties:
      RestApiId: !Ref GraphQLApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref ProjectName
      RestApiId: !Ref GraphQLApi
      DeploymentId: !Ref ApiDeployment

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      ApiStages:
        - ApiId: !Ref GraphQLApi
          Stage: !Ref ProjectName
      Description: !Sub Usage plan for the ${ProjectName} API
      Throttle:
        BurstLimit: 20
        RateLimit: 10

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub ${ProjectName}-Key
      Enabled: true

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan

Outputs:
  GraphQLApiEndpoint:
    Description: "The endpoint URL for the GraphQL API"
    Value:
      Fn::Join:
        - ''
        - - 'https://'
          - !Ref GraphQLApi
          - '.execute-api.'
          - !Ref 'AWS::Region'
          - '.amazonaws.com/'
          - !Ref ApiStage
          - '/graphql'
  ApiKeyId:
    Description: "The ID of the API Key created for this stack"
    Value: !Ref ApiKey
  LambdaFunctionName:
    Description: "GraphQL Lambda Function Name"
    Value: !Ref GraphQLFunction
