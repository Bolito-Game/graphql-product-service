AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  A unified stack for the GraphQL Product Service with dual-auth and PayPal integration.
  This version uses the explicit AWS::ApiGateway resource structure.

Parameters:
  ProjectName:
    Type: String
    Default: ProductApp
  CategoriesTableName:
    Type: String
    Default: categories
  ProductsTableName:
    Type: String
    Default: products
  OrdersTableName:
    Type: String
    Default: orders
  PayPalClientId:
    Type: String
    Description: PayPal Sandbox Client ID
  PayPalClientSecret:
    Type: String
    Description: PayPal Sandbox Client Secret
  PayPalWebhookId:
    Type: String
    Description: PayPal Sandbox Webhook ID

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Architectures:
      - x86_64

Resources:
  # =================================================================
  # == 1. DATABASE
  # =================================================================
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProductsTableName
      AttributeDefinitions: [{AttributeName: sku, AttributeType: S}, {AttributeName: category, AttributeType: S}]
      KeySchema: [{AttributeName: sku, KeyType: HASH}]
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: categoryIndex
          KeySchema: [{AttributeName: category, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  CategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref CategoriesTableName
      AttributeDefinitions: [{AttributeName: category, AttributeType: S}]
      KeySchema: [{AttributeName: category, KeyType: HASH}]
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref OrdersTableName
      AttributeDefinitions: [{AttributeName: orderId, AttributeType: S}]
      KeySchema: [{AttributeName: orderId, KeyType: HASH}]
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # =================================================================
  # == SECRETS MANAGEMENT FOR PAYPAL
  # =================================================================
  PaypalClientIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/paypal/client-id'
      Type: String
      Value: !Ref PayPalClientId
      Description: PayPal Sandbox Client ID

  PaypalClientSecretParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/paypal/client-secret'
      Type: String
      Value: !Ref PayPalClientSecret
      Description: PayPal Sandbox Client Secret

  PaypalWebhookIdParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/paypal/webhook-id'
      Type: String
      Value: !Ref PayPalWebhookId
      Description: PayPal Sandbox Webhook ID

  # =================================================================
  # == 2. LAMBDA FUNCTIONS
  # =================================================================
  GraphQLAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-GraphQL-Admin-Handler'
      CodeUri: src/
      Handler: admin.handler
      Environment: 
        Variables:
          PRODUCTS_TABLE_NAME: !Ref ProductsTableName
          CATEGORIES_TABLE_NAME: !Ref CategoriesTableName
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref ProductsTableName}
        - DynamoDBCrudPolicy: {TableName: !Ref CategoriesTableName}

  GraphQLPublicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-GraphQL-Public-Handler'
      CodeUri: src/
      Handler: public.handler
      Environment: 
        Variables:
          PRODUCTS_TABLE_NAME: !Ref ProductsTableName
          CATEGORIES_TABLE_NAME: !Ref CategoriesTableName
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref ProductsTableName}
        - DynamoDBReadPolicy: {TableName: !Ref CategoriesTableName}

  PaypalCreateOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PaypalClientIdParam
      - PaypalClientSecretParam
    Properties:
      FunctionName: !Sub '${ProjectName}-Paypal-Create-Order'
      CodeUri: src/
      Handler: paypal/createOrder.handler
      Environment: 
        Variables:
          PAYPAL_CLIENT_ID: !Ref PaypalClientIdParam
          PAYPAL_CLIENT_SECRET: !Ref PaypalClientSecretParam
          ORDERS_TABLE_NAME: !Ref OrdersTableName
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref OrdersTableName}
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/paypal/client-id'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/paypal/client-secret'

  PaypalCaptureOrderFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PaypalClientIdParam
      - PaypalClientSecretParam
    Properties:
      FunctionName: !Sub '${ProjectName}-Paypal-Capture-Order'
      CodeUri: src/
      Handler: paypal/captureOrder.handler
      Environment: 
        Variables:
          PAYPAL_CLIENT_ID: !Ref PaypalClientIdParam
          PAYPAL_CLIENT_SECRET: !Ref PaypalClientSecretParam
          ORDERS_TABLE_NAME: !Ref OrdersTableName
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref OrdersTableName}
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/paypal/client-id'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/paypal/client-secret'

  PaypalWebhookFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - PaypalWebhookIdParam
    Properties:
      FunctionName: !Sub '${ProjectName}-Paypal-Webhook-Handler'
      CodeUri: src/
      Handler: paypal/webhook.handler
      Environment: 
        Variables:
          PAYPAL_WEBHOOK_ID: !Ref PaypalWebhookIdParam
          ORDERS_TABLE_NAME: !Ref OrdersTableName
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref OrdersTableName}
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/paypal/webhook-id'

  # =================================================================
  # == 3. API GATEWAY (EXPLICIT RESOURCE DEFINITIONS)
  # =================================================================
  GraphQLApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref ProjectName
      EndpointConfiguration: {Types: [EDGE]}

  ApiGatewayCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub '${ProjectName}-Cognito-Authorizer'
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref GraphQLApi
      IdentitySource: 'method.request.header.Authorization'
      ProviderARNs: [!GetAtt CognitoUserPool.Arn]

  AdminApiResourceParent:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !GetAtt GraphQLApi.RootResourceId, PathPart: admin}
  AdminApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref AdminApiResourceParent, PathPart: graphql}
  AdminApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref AdminApiResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref ApiGatewayCognitoAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GraphQLAdminFunction.Arn}/invocations"}

  PublicApiResourceParent:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !GetAtt GraphQLApi.RootResourceId, PathPart: public}
  PublicApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref PublicApiResourceParent, PathPart: graphql}
  PublicApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref PublicApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GraphQLPublicFunction.Arn}/invocations"}

  PaypalApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref PublicApiResourceParent, PathPart: paypal}

  CreateOrderApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref PaypalApiResource, PathPart: create-order}
  CreateOrderApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref CreateOrderApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaypalCreateOrderFunction.Arn}/invocations"}

  CaptureOrderApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref PaypalApiResource, PathPart: capture-order}
  CaptureOrderApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref CaptureOrderApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaypalCaptureOrderFunction.Arn}/invocations"}

  WebhookApiResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref GraphQLApi, ParentId: !Ref PaypalApiResource, PathPart: webhook}
  WebhookApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GraphQLApi
      ResourceId: !Ref WebhookApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PaypalWebhookFunction.Arn}/invocations"}

  AdminApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref GraphQLApi, ResourceId: !Ref AdminApiResource, HttpMethod: OPTIONS, AuthorizationType: NONE, Integration: {Type: MOCK, RequestTemplates: {"application/json": '{ "statusCode": 200 }'}, IntegrationResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'", "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'", "method.response.header.Access-Control-Allow-Origin": "'*'"}}]}, MethodResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": true, "method.response.header.Access-Control-Allow-Methods": true, "method.response.header.Access-Control-Allow-Origin": true}, ResponseModels: {"application/json": "Empty"}}]}
  PublicApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref GraphQLApi, ResourceId: !Ref PublicApiResource, HttpMethod: OPTIONS, AuthorizationType: NONE, Integration: {Type: MOCK, RequestTemplates: {"application/json": '{ "statusCode": 200 }'}, IntegrationResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'", "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'", "method.response.header.Access-Control-Allow-Origin": "'*'"}}]}, MethodResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": true, "method.response.header.Access-Control-Allow-Methods": true, "method.response.header.Access-Control-Allow-Origin": true}, ResponseModels: {"application/json": "Empty"}}]}

  CreateOrderApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref GraphQLApi, ResourceId: !Ref CreateOrderApiResource, HttpMethod: OPTIONS, AuthorizationType: NONE, Integration: {Type: MOCK, RequestTemplates: {"application/json": '{ "statusCode": 200 }'}, IntegrationResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'", "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'", "method.response.header.Access-Control-Allow-Origin": "'*'"}}]}, MethodResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": true, "method.response.header.Access-Control-Allow-Methods": true, "method.response.header.Access-Control-Allow-Origin": true}, ResponseModels: {"application/json": "Empty"}}]}

  CaptureOrderApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref GraphQLApi, ResourceId: !Ref CaptureOrderApiResource, HttpMethod: OPTIONS, AuthorizationType: NONE, Integration: {Type: MOCK, RequestTemplates: {"application/json": '{ "statusCode": 200 }'}, IntegrationResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'", "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'", "method.response.header.Access-Control-Allow-Origin": "'*'"}}]}, MethodResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": true, "method.response.header.Access-Control-Allow-Methods": true, "method.response.header.Access-Control-Allow-Origin": true}, ResponseModels: {"application/json": "Empty"}}]}

  WebhookApiOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref GraphQLApi, ResourceId: !Ref WebhookApiResource, HttpMethod: OPTIONS, AuthorizationType: NONE, Integration: {Type: MOCK, RequestTemplates: {"application/json": '{ "statusCode": 200 }'}, IntegrationResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'", "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'", "method.response.header.Access-Control-Allow-Origin": "'*'"}}]}, MethodResponses: [{StatusCode: '200', ResponseParameters: {"method.response.header.Access-Control-Allow-Headers": true, "method.response.header.Access-Control-Allow-Methods": true, "method.response.header.Access-Control-Allow-Origin": true}, ResponseModels: {"application/json": "Empty"}}]}

  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref GraphQLApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref GraphQLApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [AdminApiMethod, PublicApiMethod, CreateOrderApiMethod, CaptureOrderApiMethod, WebhookApiMethod, AdminApiOptionsMethod, PublicApiOptionsMethod, CreateOrderApiOptionsMethod, CaptureOrderApiOptionsMethod, WebhookApiOptionsMethod]
    Properties:
      RestApiId: !Ref GraphQLApi
      Description: !Sub "Deployment triggered at ${AWS::StackId}"

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: v1
      RestApiId: !Ref GraphQLApi
      DeploymentId: !Ref ApiDeployment

  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub '${ProjectName}-Public-Usage-Plan'
      Description: !Sub 'Usage plan for public clients'
      Throttle: {BurstLimit: 50, RateLimit: 25}
      ApiStages:
        - ApiId: !Ref GraphQLApi
          Stage: v1

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub '${ProjectName}-Public-Key'
      Enabled: true

  ApiUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties: {KeyId: !Ref ApiKey, KeyType: API_KEY, UsagePlanId: !Ref ApiUsagePlan}

  AdminFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !GetAtt GraphQLAdminFunction.Arn, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/admin/graphql"}
  PublicFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !GetAtt GraphQLPublicFunction.Arn, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/public/graphql"}
  PaypalCreateOrderPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !GetAtt PaypalCreateOrderFunction.Arn, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/public/paypal/create-order"}
  PaypalCaptureOrderPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !GetAtt PaypalCaptureOrderFunction.Arn, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/public/paypal/capture-order"}
  PaypalWebhookPermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !GetAtt PaypalWebhookFunction.Arn, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GraphQLApi}/*/POST/public/paypal/webhook"}

  # =================================================================
  # == 4. FRONTEND INFRASTRUCTURE
  # =================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy: {MinimumLength: 8, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: true}
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties: {ClientName: !Sub '${ProjectName}-web-client', UserPoolId: !Ref CognitoUserPool, GenerateSecret: false, ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]}
  WebAppS3Bucket:
    Type: AWS::S3::Bucket
    Properties: {BucketName: !Sub '${AWS::AccountId}-${ProjectName}-webapp-bucket', AccessControl: Private, PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}}
  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties: {OriginAccessControlConfig: {Name: !Sub '${ProjectName}-oac-for-s3', OriginAccessControlOriginType: s3, SigningBehavior: always, SigningProtocol: sigv4}}
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'CDN for ${ProjectName}'
        DefaultRootObject: index.html
        Origins:
          - Id: !Sub 'S3-${WebAppS3Bucket}'
            DomainName: !GetAtt WebAppS3Bucket.DomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: !Sub 'S3-${WebAppS3Bucket}'
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        HttpVersion: http2and3
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html}
  WebAppS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppS3Bucket
      PolicyDocument:
        Statement:
          - Sid: 'AllowCloudFrontServicePrincipal'
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${WebAppS3Bucket}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:
  AdminApiEndpoint:
    Description: "The endpoint URL for the admin GraphQL API (requires Cognito JWT)"
    Value: !Sub "https://${GraphQLApi}.execute-api.${AWS::Region}.amazonaws.com/v1/admin/graphql"
  PublicApiEndpoint:
    Description: "The endpoint URL for the public GraphQL API (requires API Key)"
    Value: !Sub "https://${GraphQLApi}.execute-api.${AWS::Region}.amazonaws.com/v1/public/graphql"
  PublicApiKey:
    Description: "The ID of the API Key for public, non-authenticated clients (retrieve the key value from API Gateway console or CLI)."
    Value: !Ref ApiKey
  UserPoolId:
    Description: 'Cognito User Pool ID for admin web app .env file'
    Value: !Ref CognitoUserPool
  UserPoolClientId:
    Description: 'Cognito User Pool Client ID for admin web app .env file'
    Value: !Ref CognitoUserPoolClient
  CloudFrontDomainName:
    Description: 'Domain name of the CloudFront distribution for the admin web app'
    Value: !GetAtt CloudFrontDistribution.DomainName
  WebAppS3BucketName:
    Description: 'Name of the S3 bucket where the admin web app is deployed'
    Value: !Ref WebAppS3Bucket
  AWSRegion:
    Description: "The AWS Region where the stack is deployed for admin web app .env file"
    Value: !Ref AWS::Region